<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lilacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#18181b"/>
  
  <!-- Inner soft lilac glow circle -->
  <circle cx="256" cy="256" r="180" fill="#27272a" stroke="url(#lilacGrad)" stroke-width="4"/>

  <!-- Jewelry earring / gem motif -->
  <!-- Earring hook / loop in gold/lilac -->
  <path d="M 256 120 C 235 120 220 135 220 155 C 220 170 230 182 245 188 L 245 210" fill="none" stroke="url(#goldAccent)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="216" r="10" fill="url(#goldAccent)"/>

  <!-- Drop pendant / gemstone crescent & star in lilac -->
  <path d="M 256 230 C 205 230 165 272 165 325 C 165 378 205 410 256 410 C 285 410 315 398 335 375 C 310 378 275 365 260 338 C 245 310 252 275 275 250 C 269 237 262 230 256 230 Z" fill="url(#lilacGrad)"/>
  
  <!-- Sparkling gem accent inside -->
  <path d="M 230 320 Q 230 300 240 290 Q 250 300 250 320 Q 250 340 240 350 Q 230 340 230 320 Z" fill="#ffffff"/>
  <circle cx="295" cy="305" r="7" fill="#ffffff"/>
  <circle cx="315" cy="335" r="5" fill="url(#goldAccent)"/>
</svg>
